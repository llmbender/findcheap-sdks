[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findcheap"
version = "0.1.0"
description = "Find where the product on a page is sold for less: the Findcheap API's search, extract and resolve calls."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Findcheap", email = "support@findcheap.ai" }]
keywords = ["findcheap", "price comparison", "shopping", "agents", "product search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://findcheap.ai/developers"
Documentation = "https://findcheap.ai/developers/docs"

[tool.setuptools.packages.find]
where = ["src"]
