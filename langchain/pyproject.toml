[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-findcheap"
version = "0.1.0"
description = "LangChain tools for Findcheap, which finds where a product is sold for less: the same product and its equivalents, cheapest first."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Findcheap", email = "support@findcheap.ai" }]
keywords = ["findcheap", "langchain", "price comparison", "shopping", "agents", "product search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
# The Findcheap client does the calls (standard library only); langchain-core
# gives the tool classes. The lower bound of langchain-core is the oldest
# version the tests were run against.
dependencies = ["findcheap>=0.3.0,<1.0.0", "langchain-core>=1.4.0,<2.0.0"]

[project.optional-dependencies]
# What the tests need: pytest, and LangChain's own standard tests for tools.
test = ["pytest>=8", "langchain-tests>=1.0.0,<2.0.0"]

[project.urls]
Homepage = "https://findcheap.ai/developers"
Documentation = "https://findcheap.ai/developers/docs"
Repository = "https://github.com/llmbender/findcheap-sdks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langchain_findcheap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LangChain's standard tests call each tool through its async door too;
# pytest-asyncio (which comes with langchain-tests) runs those.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
